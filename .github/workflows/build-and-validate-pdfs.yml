name: Validar y Compilar Manuales PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.js'
      - 'package.json'
      - 'UNITY/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.js'
      - 'package.json'
      - 'UNITY/**'
      - '.github/workflows/**'

jobs:
  build-pdfs:
    name: 📄 Validar y Compilar 6 Manuales PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verificar / Instalar Google Chrome Headless
        run: |
          if ! command -v google-chrome &> /dev/null; then
            sudo apt update
            sudo apt install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt update
            sudo apt install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Instalar dependencias npm
        run: npm ci || npm install

      - name: Compilar Manuales Generales y de Unity
        run: npm run build

      - name: Verificar Integridad de los 6 PDFs Generados
        run: |
          echo "Verificando que los 6 PDFs existen y tienen contenido..."
          PDF_FILES=(
            "manual-github-debian-linux.pdf"
            "manual-github-powershell-windows.pdf"
            "manual-github-macos-apple-silicon.pdf"
            "UNITY/manual-unity-github-debian-linux.pdf"
            "UNITY/manual-unity-github-powershell-windows.pdf"
            "UNITY/manual-unity-github-macos-apple-silicon.pdf"
          )
          for pdf in "${PDF_FILES[@]}"; do
            if [ ! -s "$pdf" ]; then
              echo "❌ Error: $pdf no existe o está vacío"
              exit 1
            fi
            echo "✓ $pdf generado correctamente ($(du -h "$pdf" | cut -f1))"
          done
          echo "🎉 ¡Todos los 6 PDFs han sido verificados exitosamente!"

      - name: Subir PDFs Compilados como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: manuales-pdf-alta-resolucion
          path: |
            manual-github-*.pdf
            UNITY/manual-unity-*.pdf
